<g fill="#e7edde" stroke="#72816a" stroke-width="2"><rect x="63" y="158" width="87" height="59" rx="5"/><rect x="168" y="181" width="62" height="45" rx="5"/><rect x="266" y="148" width="121" height="83" rx="5"/></g>
