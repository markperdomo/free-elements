<text x="40" y="52" font-family="system-ui,sans-serif" font-size="26" font-weight="650" fill="#24372b">Less nudging. More presenting.</text>
<text x="40" y="91" font-family="system-ui,sans-serif" font-size="15" fill="#566451">Align · Space · Resize · Format</text>
