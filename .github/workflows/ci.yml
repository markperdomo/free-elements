name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          package-manager-cache: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - run: npm test
      - run: python3 -m unittest discover -s native/tests -p 'test_*.py'
      - run: python3 scripts/package-source.py --check
  native:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - run: python3 scripts/build-native.py --distribution --output-dir dist/distribution
      - name: Test palette attachment geometry
        run: |
          xcrun swiftc -module-cache-path dist/distribution/module-cache native/macos/FreeElements.swift native/tests/AttachmentLayoutTests.swift -o dist/distribution/attachment-tests
          dist/distribution/attachment-tests
      - run: codesign --verify --strict dist/distribution/FreeElements-*.bundle
